<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de Imágenes</title>
    <style>
        :root {
            --bg-1: #1a1a2e;
            --bg-2: #16213e;
            --bg-3: #0f3460;
            --accent: #e94560;
            --accent-dark: #c73e54;
            --accent-soft: rgba(233, 69, 96, 0.1);
            --accent-glow: rgba(233, 69, 96, 0.5);
            --gold: #ffd700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        .drop-zone {
            width: 300px;
            min-height: 200px;
            border: 3px dashed var(--accent);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--accent-soft);
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .drop-zone.dragover {
            background: var(--accent-soft);
            border-color: var(--gold);
            transform: scale(1.02);
        }

        .drop-zone p {
            font-size: 1.1rem;
            margin: 6px 0;
        }

        .drop-zone .hint {
            font-size: 0.85rem;
            color: #bbb;
        }

        .spin-btn {
            margin-top: 20px;
            padding: 14px 45px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: all 0.3s ease;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .wheel-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-wrap {
            position: relative;
            display: inline-block;
        }

        .arrow {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 42px;
            line-height: 1;
            z-index: 5;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7));
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            cursor: default;
        }

        .status {
            margin-top: 16px;
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 26px;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .preview-title {
            width: 300px;
            margin-top: 20px;
            text-align: center;
            font-size: 1rem;
            color: #ccc;
        }

        .preview-images {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            max-width: 620px;
        }

        .preview-item {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .remove-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.7rem;
            line-height: 1;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: var(--accent);
        }

        footer {
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <h1>🎰 Ruleta de Imágenes</h1>

    <div class="container">
        <div>
            <div id="dropZone" class="drop-zone">
                <p>📁 Arrastra imágenes aquí</p>
                <p class="hint">(mínimo 2, máximo 25)</p>
                <p class="hint">o haz clic para seleccionar</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
            <button id="spinBtn" class="spin-btn" disabled>🎯 GIRAR</button>
        </div>

        <div class="wheel-area">
            <div class="wheel-wrap">
                <div class="arrow">⬇️</div>
                <canvas id="wheel" width="400" height="400"></canvas>
            </div>
            <div id="status" class="status"></div>
        </div>
    </div>

    <p id="previewTitle" class="preview-title">Imágenes agregadas</p>
    <div id="previewImages" class="preview-images"></div>

    <footer>by SandovalJon</footer>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const spinBtn = document.getElementById('spinBtn');
        const status = document.getElementById('status');
        const previewImages = document.getElementById('previewImages');
        const previewTitle = document.getElementById('previewTitle');

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = Math.min(centerX, centerY) - 10;

        const colors = ['#e94560', '#0f3460', '#22c55e', '#f59e0b', '#8b5cf6', '#06b6d4', '#ec4899', '#84cc16'];

        let images = [];
        let loadedImages = [];
        let isSpinning = false;
        let currentRotation = 0;
        let winnerIndex = -1;
        let winnerZoom = 0;
        let spinTimeout = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            const newImages = Array.from(files).filter(f => f.type.startsWith('image/'));

            if (images.length + newImages.length > 25) {
                status.textContent = 'Máximo 25 imágenes permitidas';
                return;
            }

            newImages.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    images.push(e.target.result);
                    const img = new Image();
                    img.onload = () => {
                        loadedImages.push(img);
                        updatePreview();
                        drawRoulette();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function updatePreview() {
            previewTitle.textContent = `Imágenes agregadas (${images.length}/25)`;
            previewImages.innerHTML = images.map((src, index) =>
                `<div class="preview-item" data-index="${index}">
                    <img src="${src}" alt="preview">
                    <button class="remove-btn" data-index="${index}" title="Quitar">✕</button>
                </div>`
            ).join('');
            spinBtn.disabled = loadedImages.length < 2 || isSpinning;
            if (loadedImages.length < 2) {
                status.textContent = loadedImages.length === 0 ? 'Agrega imágenes para comenzar' : 'Agrega al menos 2 imágenes';
            } else {
                status.textContent = `${loadedImages.length} imágenes · listo para girar`;
            }
        }

        previewImages.addEventListener('click', (e) => {
            const btn = e.target.closest('.remove-btn');
            if (!btn) return;
            const index = parseInt(btn.dataset.index, 10);
            if (isNaN(index)) return;
            images.splice(index, 1);
            loadedImages.splice(index, 1);
            winnerIndex = -1;
            winnerZoom = 0;
            updatePreview();
            drawRoulette();
        });

        function drawRoulette() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (loadedImages.length === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#333';
                ctx.fill();
                ctx.strokeStyle = '#e94560';
                ctx.lineWidth = 5;
                ctx.stroke();
                return;
            }

            const sliceAngle = (Math.PI * 2) / loadedImages.length;

            loadedImages.forEach((img, index) => {
                const startAngle = index * sliceAngle + currentRotation;
                const endAngle = startAngle + sliceAngle;
                const midAngle = startAngle + sliceAngle / 2;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = colors[index % colors.length];
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(midAngle);
                const imageDistance = radius * 0.6;
                const imgSize = Math.min(80, radius * 0.35);

                ctx.save();
                ctx.translate(imageDistance, 0);
                ctx.rotate(-midAngle);
                ctx.beginPath();
                ctx.arc(0, 0, imgSize / 2, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(img, -imgSize / 2, -imgSize / 2, imgSize, imgSize);
                ctx.restore();
                ctx.restore();
            });
        }

        spinBtn.addEventListener('click', () => {
            if (isSpinning || loadedImages.length < 2) return;
            spin();
        });

        function spin() {
            isSpinning = true;
            winnerIndex = -1;
            winnerZoom = 0;
            spinBtn.disabled = true;
            status.textContent = '... Girando ...';

            const totalRotation = (10 + window.crypto.getRandomValues(new Uint32Array(1))[0] % 21) * Math.PI * 2;
            const spinDuration = 3000 + window.crypto.getRandomValues(new Uint32Array(1))[0] % 4000;
            const startTime = Date.now();
            const startRotation = currentRotation;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / spinDuration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);

                currentRotation = startRotation + totalRotation * easeOut;
                drawRoulette();

                if (progress < 1) {
                    spinTimeout = requestAnimationFrame(animate);
                } else {
                    finishSpin();
                }
            }

            animate();
        }

        function finishSpin() {
            const sliceAngle = (Math.PI * 2) / loadedImages.length;
            const normalizedRotation = ((currentRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
            const pointerAngle = ((Math.PI * 3 / 2 - normalizedRotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
            const selectedIndex = Math.floor(pointerAngle / sliceAngle) % loadedImages.length;

            isSpinning = false;
            winnerIndex = selectedIndex;
            winnerZoom = 0;
            status.textContent = `🎉 ¡GANADOR! 🎉`;
            spinBtn.disabled = false;
            const zoomStart = Date.now();
            const zoomDuration = 1500;

            function animateWinner() {
                const elapsed = Date.now() - zoomStart;
                const progress = Math.min(elapsed / zoomDuration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                winnerZoom = easeOut;
                drawWinner();
                if (progress < 1) {
                    spinTimeout = requestAnimationFrame(animateWinner);
                }
            }

            animateWinner();
        }

        function drawWinner() {
            drawRoulette();
            const winnerImg = loadedImages[winnerIndex];
            const displaySize = radius * 2 * winnerZoom;

            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.clip();

            ctx.fillStyle = '#000';
            ctx.globalAlpha = Math.min(0.9, winnerZoom * 1.2);
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            const w = winnerImg.width;
            const h = winnerImg.height;
            const ratio = displaySize / Math.max(w, h);
            const dw = w * ratio;
            const dh = h * ratio;

            ctx.globalAlpha = Math.min(1, winnerZoom * 1.5);
            ctx.drawImage(winnerImg, centerX - dw / 2, centerY - dh / 2, dw, dh);
            ctx.globalAlpha = 1;
            ctx.restore();

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius - 4, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 6;
            ctx.stroke();
        }
    </script>
</body>
</html>
