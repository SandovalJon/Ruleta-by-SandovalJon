<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de Imágenes</title>
    <style>
        :root {
            --bg-1: #1a1a2e;
            --bg-2: #16213e;
            --bg-3: #0f3460;
            --accent: #e94560;
            --accent-dark: #c73e54;
            --accent-light: #ff6b6b;
            --accent-soft: rgba(233, 69, 96, 0.1);
            --accent-soft-strong: rgba(233, 69, 96, 0.3);
            --accent-glow-1: rgba(233, 69, 96, 0.5);
            --accent-glow-2: rgba(233, 69, 96, 0.3);
            --accent-glow-3: rgba(233, 69, 96, 0.4);
            --accent-glow-4: rgba(233, 69, 96, 0.6);
            --gold: #ffd700;
            --gold-soft: rgba(255, 215, 0, 0.2);
            --gold-soft-strong: rgba(255, 215, 0, 0.25);
            --gold-glow: rgba(255, 215, 0, 0.3);
            --text-muted: #ccc;
            --text-hint: #bbb;
        }

        body[data-theme="esmeralda"] {
            --bg-1: #0a1f1a;
            --bg-2: #0d2b23;
            --bg-3: #123d30;
            --accent: #2ecc71;
            --accent-dark: #1fa85b;
            --accent-light: #58d68d;
            --accent-soft: rgba(46, 204, 113, 0.1);
            --accent-soft-strong: rgba(46, 204, 113, 0.3);
            --accent-glow-1: rgba(46, 204, 113, 0.5);
            --accent-glow-2: rgba(46, 204, 113, 0.3);
            --accent-glow-3: rgba(46, 204, 113, 0.4);
            --accent-glow-4: rgba(46, 204, 113, 0.6);
            --gold: #f1c40f;
            --gold-soft: rgba(241, 196, 15, 0.2);
            --gold-soft-strong: rgba(241, 196, 15, 0.25);
            --gold-glow: rgba(241, 196, 15, 0.3);
        }

        body[data-theme="atardecer"] {
            --bg-1: #261014;
            --bg-2: #33141b;
            --bg-3: #471d22;
            --accent: #ff8c42;
            --accent-dark: #e06e23;
            --accent-light: #ffb266;
            --accent-soft: rgba(255, 140, 66, 0.1);
            --accent-soft-strong: rgba(255, 140, 66, 0.3);
            --accent-glow-1: rgba(255, 140, 66, 0.5);
            --accent-glow-2: rgba(255, 140, 66, 0.3);
            --accent-glow-3: rgba(255, 140, 66, 0.4);
            --accent-glow-4: rgba(255, 140, 66, 0.6);
            --gold: #ffd700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            transition: background 0.4s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .theme-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .theme-btn {
            padding: 8px 18px;
            font-size: 0.9rem;
            color: white;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-btn:hover {
            border-color: white;
            transform: translateY(-2px);
        }

.theme-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow-3);
        }

        .lang-select {
            margin-left: 6px;
            padding: 8px 12px;
            font-size: 0.9rem;
            color: white;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: border-color 0.3s ease;
            outline: none;
        }

        .lang-select:hover {
            border-color: white;
        }

        .lang-select option {
            background: #222;
            color: white;
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        .drop-zone {
            width: 300px;
            min-height: 200px;
            border: 3px dashed var(--accent);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--accent-soft);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent-light);
            background: var(--accent-soft-strong);
            transform: scale(1.02);
        }

        .drop-zone-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .drop-zone-text {
            font-size: 1.1rem;
            text-align: center;
            color: var(--text-muted);
        }

        .preview-images {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
            max-width: 280px;
        }

        .preview-item {
            position: relative;
            border-radius: 8px;
        }

        .preview-item img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--accent);
            display: block;
        }

        .preview-item .remove-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            will-change: opacity;
            transform: translateZ(0);
        }

        .preview-item:hover .remove-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .preview-item .remove-btn {
            width: 26px;
            height: 26px;
            background: var(--accent);
            color: white;
            border: 2px solid #fff;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: bold;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, background 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .preview-item .remove-btn:hover {
            background: var(--accent-dark);
            transform: scale(1.2);
        }

        .preview-item.removed {
            animation: fadeOut 0.3s ease forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.7); }
        }

        .roulette-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .arrow {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid var(--gold);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            z-index: 10;
            position: relative;
            top: 5px;
        }

        .roulette-wrapper {
            position: relative;
        }

canvas {
            width: 400px;
            max-width: 100%;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0 30px var(--accent-glow-1), 0 0 60px var(--accent-glow-2);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        canvas:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px var(--accent-glow-3), 0 0 55px var(--accent-glow-1);
        }

        .roulette-wrapper.winner-mode canvas {
            animation: gold-pulse 2s ease-in-out infinite;
        }

        .roulette-wrapper.winner-mode canvas:hover {
            transform: scale(1.05);
        }

        @keyframes gold-pulse {
            0%, 100% { box-shadow: 0 0 15px var(--gold-soft-strong), 0 0 40px var(--gold-glow); }
            50% { box-shadow: 0 0 28px var(--gold-soft-strong), 0 0 75px var(--gold-glow); }
        }

        .result {
            margin-top: 20px;
            padding: 15px 30px;
            background: var(--gold-soft);
            border: 2px solid var(--gold);
            border-radius: 15px;
            font-size: 1.2rem;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .result-hint {
            margin-top: 10px;
            font-size: 0.95rem;
            color: var(--text-hint);
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            min-height: auto;
            font-weight: normal;
        }

        .result.winner {
            background: var(--gold-soft-strong);
            border-color: var(--gold);
            font-weight: bold;
            font-size: 1.5rem;
            letter-spacing: 1px;
            box-shadow: 0 0 20px var(--gold-glow);
        }

.clear-btn {
            margin: 10px auto 0;
            display: block;
            padding: 10px 25px;
            font-size: 1rem;
            color: var(--accent);
            background: transparent;
            border: 2px solid var(--accent);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            background: var(--accent);
            color: white;
        }

        .hidden {
            display: none;
        }

.footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 1.5px;
        }

        .footer span {
            color: var(--accent);
            opacity: 0.7;
        }

        .roulette-container {
            max-width: 100%;
        }

        @media (hover: none) {
            canvas:hover {
                transform: none;
            }
            .roulette-wrapper.winner-mode canvas:hover {
                transform: none;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 14px 12px;
            }
            h1 {
                font-size: 1.7rem;
            }
            .container {
                gap: 24px;
            }
            .drop-zone {
                width: 100%;
                max-width: 300px;
            }
            .preview-images {
                max-width: 100%;
            }
            .theme-switcher {
                flex-wrap: wrap;
                justify-content: center;
            }
            .result {
                font-size: 1.05rem;
                padding: 12px 18px;
            }
        }
    </style>
</head>

        function t(key) {
            return L[currentLang][key];
        }

        function setLanguage(lang) {
            if (!L[lang]) lang = 'es';
            currentLang = lang;
            titleEl.textContent = t('title');
            dropText.textContent = t('drop');
            dropHint.textContent = t('dropHint');
            clearBtn.textContent = t('clear');
            document.querySelector('.theme-btn[data-theme="noche"]').textContent = t('themeBtnNoche');
            document.querySelector('.theme-btn[data-theme="esmeralda"]').textContent = t('themeBtnEsmeralda');
            document.querySelector('.theme-btn[data-theme="atardecer"]').textContent = t('themeBtnAtardecer');
            document.querySelector('.theme-btn[data-theme="noche"]').title = t('themeNoche');
            document.querySelector('.theme-btn[data-theme="esmeralda"]').title = t('themeEsmeralda');
            document.querySelector('.theme-btn[data-theme="atardecer"]').title = t('themeAtardecer');
            langSelect.value = lang;
            refreshMessages();
        }

        function refreshMessages() {
            if (isLoading) {
                result.textContent = t('loading');
                return;
            }
            if (isSpinning) {
                result.textContent = t('spinning');
                return;
            }
            if (winnerIndex >= 0) {
                result.classList.add('winner');
                result.innerHTML = t('winner');
                resultHint.innerHTML = t('hint');
                resultHint.classList.remove('hidden');
                return;
            }
            result.classList.remove('winner');
            resultHint.classList.add('hidden');
            if (loadedImages.length === 0) {
                result.textContent = t('empty');
            } else if (loadedImages.length === 1) {
                result.textContent = t('min');
            } else {
                result.textContent = t('preview').replace('{n}', loadedImages.length);
            }
        }

        langSelect.addEventListener('change', () => {
            setLanguage(langSelect.value);
            try {
                localStorage.setItem('roulette-lang', langSelect.value);
            } catch (e) {}
        });

        const themeColors = {
            noche: [
                '#e94560', '#0f3460', '#533483', '#16c79a',
                '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4',

            ],
            esmeralda: [

            atardecer: [

                '#ffb266', '#ff6348', '#f39c12', '#ed7d31',
                '#ff9f43', '#d35400', '#fd9644', '#e67e22'
            ]
        };

function setTheme(theme) {
            currentTheme = theme;
            document.body.dataset.theme = theme;
            colors = themeColors[theme];
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
            rebuildWheel();
            try {
                localStorage.setItem('roulette-theme', theme);
            } catch (e) {}
        }

        themeSwitcher.addEventListener('click', (e) => {
            const btn = e.target.closest('.theme-btn');
            if (btn) setTheme(btn.dataset.theme);
        });

let colors = themeColors[currentTheme];

        try {
            const savedTheme = localStorage.getItem('roulette-theme');
            if (savedTheme && themeColors[savedTheme]) {
                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === savedTheme);
                });
                document.body.dataset.theme = savedTheme;
                currentTheme = savedTheme;
                colors = themeColors[savedTheme];
            }
        } catch (e) {}

        try {
            const savedLang = localStorage.getItem('roulette-lang');
            if (savedLang && L[savedLang]) {
                setLanguage(savedLang);
            } else {
                const navLang = (navigator.languages && navigator.languages[0]) ? navigator.languages[0] : navigator.language;
                const detected = (navLang || 'es').split('-')[0];
                setLanguage(L[detected] ? detected : 'es');
            }
        } catch (e) {
            setLanguage('es');
        }

        function cryptoRand() {
            const buf = new Uint32Array(1);
            crypto.getRandomValues(buf);
            return buf[0] / 4294967296;
        }

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

clearBtn.addEventListener('click', () => {
            images = [];
            loadedImages = [];
            thumbImages = [];
            previewImages.innerHTML = '';
            rouletteWrapper.classList.remove('winner-mode');
            isHovering = false;
            currentRotation = 0;
            winnerIndex = -1;
            winnerZoom = 0;
            rebuildWheel();
            refreshMessages();
        });

        const MAX_IMAGE = 800;

        function processImage(file, callback) {
            const reader = new FileReader();
            reader.onerror = () => callback(null);
            reader.onload = (e) => {
                const img = new Image();
                img.onerror = () => callback(null);
                img.onload = () => {
                    const scale = Math.min(1, MAX_IMAGE / Math.max(img.width, img.height));
                    if (scale >= 1) {
                        callback(e.target.result);
                        return;
                    }
                    const c = document.createElement('canvas');
                    c.width = Math.round(img.width * scale);
                    c.height = Math.round(img.height * scale);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                    callback(c.toDataURL(mime, 0.92));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleFiles(files) {
            const newImages = Array.from(files).filter(f => f.type.startsWith('image/'));
            
            if (images.length + newImages.length > 25) {
                result.textContent = t('max');
                return;
            }

            if (newImages.length === 0) return;

            isLoading = true;
            pendingLoads += newImages.length;
            refreshMessages();
            drawRoulette();

            newImages.forEach(file => {
                processImage(file, (dataUrl) => {
                    if (!dataUrl) {
                        pendingLoads--;
                        if (pendingLoads <= 0) {
                            pendingLoads = 0;
                            isLoading = false;
                            rebuildWheel();
                            refreshMessages();
                        }
                        return;
                    }
                    images.push(dataUrl);
                    const img = new Image();
                    img.onload = () => {
                        loadedImages.push(img);
                        thumbImages.push(makeThumb(img, 128));
                        pendingLoads--;
                        if (pendingLoads <= 0) {
                            pendingLoads = 0;
                            isLoading = false;
                        }
                        updatePreview();
                        if (isLoading) {
                            drawRoulette();
                        } else {
                            rebuildWheel();
                        }
                        refreshMessages();
                    };
                    img.onerror = () => {
                        pendingLoads--;
                        if (pendingLoads <= 0) {
                            pendingLoads = 0;
                            isLoading = false;
                            rebuildWheel();
                            refreshMessages();
                        }
                    };
                    img.src = dataUrl;
                });
            });
        }

        function updatePreview() {
            previewImages.innerHTML = images.map((src, index) => 
                `<div class="preview-item" data-index="${index}">
                    <img src="${src}" alt="preview">
                    <div class="remove-overlay">
                        <button class="remove-btn" data-index="${index}" title="Eliminar">✕</button>
                    </div>
                </div>`
            ).join('');
        }

function removeImage(index) {
            images.splice(index, 1);
            loadedImages.splice(index, 1);
            thumbImages.splice(index, 1);
            winnerIndex = -1;
            winnerZoom = 0;
            isHovering = false;
            rouletteWrapper.classList.remove('winner-mode');
            updatePreview();
            rebuildWheel();
            refreshMessages();
        }

        previewImages.addEventListener('click', (e) => {
            const item = e.target.closest('.preview-item');
            if (!item) return;
            const index = parseInt(item.dataset.index, 10);
            if (!isNaN(index)) removeImage(index);
        });

const wheelCache = document.createElement('canvas');
        wheelCache.width = canvas.width;
        wheelCache.height = canvas.height;
        const wheelCtx = wheelCache.getContext('2d');

        function makeThumb(img, size) {
            const scale = size / Math.max(img.width, img.height);
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            return c;
        }

        function prerenderWheel() {
            const ox = wheelCache.width / 2;
            const oy = wheelCache.height / 2;
            const radius = Math.min(ox, oy) - 10;

            wheelCtx.clearRect(0, 0, wheelCache.width, wheelCache.height);

            if (loadedImages.length === 0) {
                wheelCtx.beginPath();
                wheelCtx.arc(ox, oy, radius, 0, Math.PI * 2);
                wheelCtx.fillStyle = '#333';
                wheelCtx.fill();
                wheelCtx.strokeStyle = '#e94560';
                wheelCtx.lineWidth = 5;
                wheelCtx.stroke();
                return;
            }

            const sliceAngle = (Math.PI * 2) / loadedImages.length;

            loadedImages.forEach((img, index) => {
                const startAngle = index * sliceAngle;
                const endAngle = startAngle + sliceAngle;
                const midAngle = startAngle + sliceAngle / 2;
                const thumb = thumbImages[index] || img;

                wheelCtx.beginPath();
                wheelCtx.moveTo(ox, oy);
                wheelCtx.arc(ox, oy, radius, startAngle, endAngle);
                wheelCtx.closePath();
                wheelCtx.fillStyle = colors[index % colors.length];
                wheelCtx.fill();
                wheelCtx.strokeStyle = '#fff';
                wheelCtx.lineWidth = 3;
                wheelCtx.stroke();

                const imageDistance = radius * 0.6;
                const imgSize = Math.min(80, radius * 0.35);

                wheelCtx.save();
                wheelCtx.translate(ox, oy);
                wheelCtx.rotate(midAngle);
                wheelCtx.translate(imageDistance, 0);
                wheelCtx.rotate(-midAngle);
                wheelCtx.beginPath();
                wheelCtx.arc(0, 0, imgSize / 2, 0, Math.PI * 2);
                wheelCtx.clip();
                wheelCtx.drawImage(thumb, -imgSize / 2, -imgSize / 2, imgSize, imgSize);
                wheelCtx.restore();
            });
        }

        function rebuildWheel() {
            prerenderWheel();
            drawRoulette();
        }

        function drawRoulette() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isLoading || loadedImages.length === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#000';
                ctx.fill();
                ctx.strokeStyle = '#e94560';
                ctx.lineWidth = 5;
                ctx.stroke();
                return;
            }

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation);
            ctx.drawImage(wheelCache, -centerX, -centerY);
            ctx.restore();

            if (isHovering && !isSpinning && winnerIndex < 0 && loadedImages.length >= 2) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius - 10, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.lineWidth = 4;
                ctx.setLineDash([16, 10]);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.font = '64px Segoe UI Emoji, Segoe UI, Tahoma, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
                ctx.shadowBlur = 10;
                ctx.fillText('🎯', centerX, centerY - 10);
                ctx.shadowBlur = 0;
            }

            if (winnerIndex >= 0 && winnerZoom > 0) {
                const winnerImg = loadedImages[winnerIndex];
                const displaySize = radius * 2 * winnerZoom;

                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.clip();

                ctx.fillStyle = '#000';
                ctx.globalAlpha = Math.min(0.9, winnerZoom * 1.2);
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                const w = winnerImg.width;
                const h = winnerImg.height;
                const ratio = displaySize / Math.max(w, h);
                const dw = w * ratio;
                const dh = h * ratio;

                ctx.globalAlpha = Math.min(1, winnerZoom * 1.5);
                ctx.drawImage(winnerImg, centerX - dw / 2, centerY - dh / 2, dw, dh);
                ctx.globalAlpha = 1;
                ctx.restore();

                ctx.beginPath();
                ctx.arc(centerX, centerY, radius - 4, 0, Math.PI * 2);
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 6;
                ctx.stroke();

                if (isHovering) {
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius - 12, 0, Math.PI * 2);
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([12, 8]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.font = '56px Segoe UI Emoji, Segoe UI, Tahoma, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
                    ctx.shadowBlur = 10;
                    ctx.fillText('🔄', centerX, centerY + radius * 0.55);
                    ctx.shadowBlur = 0;
                }
            }
        }

        function spin() {
            if (isSpinning || loadedImages.length < 2) return;

isSpinning = true;
            refreshMessages();

            const spinDuration = 3000 + cryptoRand() * 4000;
            const totalRotation = Math.PI * 2 * (10 + cryptoRand() * 20);
            const startTime = Date.now();
            const startRotation = currentRotation;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / spinDuration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                currentRotation = startRotation + totalRotation * easeOut;
                drawRoulette();

                if (progress < 1) {
                    spinTimeout = requestAnimationFrame(animate);
                } else {
                    finishSpin();
                }
            }

            animate();
        }

        function finishSpin() {
            const sliceAngle = (Math.PI * 2) / loadedImages.length;
            const normalizedRotation = ((currentRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
            const pointerAngle = ((Math.PI * 3 / 2 - normalizedRotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
            const selectedIndex = Math.floor(pointerAngle / sliceAngle) % loadedImages.length;

rouletteWrapper.classList.add('winner-mode');
            isSpinning = false;

            winnerIndex = selectedIndex;
            winnerZoom = 0;
            refreshMessages();
            const zoomStart = Date.now();
            const zoomDuration = 1500;

            function animateWinner() {
                const elapsed = Date.now() - zoomStart;
                const progress = Math.min(elapsed / zoomDuration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                winnerZoom = easeOut;
                drawRoulette();

                if (progress < 1) {
                    spinTimeout = requestAnimationFrame(animateWinner);
                }
            }

            animateWinner();
        }

canvas.addEventListener('mouseenter', () => {
            isHovering = true;
            drawRoulette();
        });

        canvas.addEventListener('mouseleave', () => {
            if (isHovering) {
                isHovering = false;
                drawRoulette();
            }
        });

        canvas.addEventListener('click', () => {
            if (isSpinning) return;
if (winnerIndex >= 0) {
                winnerIndex = -1;
                winnerZoom = 0;
                isHovering = false;
                rouletteWrapper.classList.remove('winner-mode');
                drawRoulette();
                refreshMessages();
                return;
            }
            spin();
        });
    </script>
</body>
</html>
